<div class="au-card">
  <!--au-resumable:start:resumable-counter-->
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">${title}</h3>
      <p class="au-card-subtitle">${description}</p>
    </div>
    <span class="au-tag au-tag-purple">Resumable</span>
  </div>

  <div class="au-card-body">
    <div class="flex items-center justify-between gap-4">
      <!-- Zero-Hydration Lazy Event Binding -->
      <button type="button" data-au-event="click->increment" data-action="increment" class="au-btn-primary">
        Count: <span data-au-bind="count">${count}</span>
      </button>
      <div class="text-right">
        <span class="text-[11px] text-muted-foreground block">Hydration Mode</span>
        <span class="text-xs font-mono font-semibold text-purple-400">Zero JS On-Demand</span>
      </div>
    </div>
  </div>
  <!--au-resumable:end:resumable-counter-->
</div>
