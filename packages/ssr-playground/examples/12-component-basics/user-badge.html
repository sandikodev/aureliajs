<div class="au-card">
  <!-- Card Header -->
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">Component Basics</h3>
      <p class="au-card-subtitle">Class getters &amp; bindables</p>
    </div>
    <span class="au-tag au-tag-emerald">@customElement</span>
  </div>

  <!-- Card Body -->
  <div class="au-card-body">
    <div class="flex items-center gap-3.5">
      <div class="au-avatar">
        ${initials}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
          <div class="text-xs font-semibold text-foreground truncate">${fullName}</div>
          <span class="au-tag au-tag-emerald">
            <span class="au-dot bg-emerald-400"></span>
            ${status}
          </span>
        </div>
        <div class="text-[11px] text-muted-foreground mt-0.5 truncate">${role}</div>
      </div>
    </div>
  </div>
</div>
