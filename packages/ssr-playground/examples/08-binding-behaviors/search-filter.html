<div class="p-6 max-w-md mx-auto bg-card rounded-xl shadow-md border space-y-4">
  <div class="flex items-center justify-between border-b border-border pb-3">
    <div>
      <h2 class="text-xl font-bold text-foreground">Binding Behaviors</h2>
      <p class="text-xs text-muted-foreground">Fine-grained timing modifiers (& debounce, & throttle)</p>
    </div>
    <span class="px-2 py-0.5 text-xs rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 font-mono font-medium">&amp; debounce</span>
  </div>

  <div class="space-y-3">
    <div>
      <label class="block text-xs font-medium text-foreground mb-1">Instant Filter (& debounce:300)</label>
      <input type="text" value.bind="query & debounce:300" placeholder="Type to search packages..." class="w-full px-3 py-1.5 text-xs rounded-md border border-border bg-background text-foreground focus:outline-none" />
      <span class="text-[10px] text-muted-foreground">Triggers evaluation only after 300ms pause</span>
    </div>

    <div class="p-3 bg-secondary rounded-lg border border-border text-xs space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-muted-foreground">Active Filter Query:</span>
        <span class="font-mono font-bold text-primary">${query || '(none)'}</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-muted-foreground">Filtered Match Count:</span>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400">${matchCount} modules</span>
      </div>
    </div>
  </div>
</div>
