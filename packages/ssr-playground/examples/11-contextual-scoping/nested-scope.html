<div class="p-6 max-w-md mx-auto bg-card rounded-xl shadow-md border space-y-4">
  <div class="flex items-center justify-between border-b border-border pb-3">
    <div>
      <h2 class="text-xl font-bold text-foreground">Contextual Scoping</h2>
      <p class="text-xs text-muted-foreground">Scope nesting using with.bind</p>
    </div>
    <span class="px-2 py-0.5 text-xs rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-mono font-medium">with.bind</span>
  </div>

  <div class="p-4 rounded-xl border border-border bg-secondary space-y-3">
    <div class="flex items-center space-x-3">
      <div class="size-10 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold">
        ${organization.name.charAt(0)}
      </div>
      <div>
        <h3 class="text-sm font-bold text-foreground">${organization.name}</h3>
        <p class="text-[11px] text-muted-foreground">Tier: ${organization.tier}</p>
      </div>
    </div>

    <div class="pt-2 border-t border-border grid grid-cols-2 gap-2 text-xs">
      <div>
        <span class="text-muted-foreground">Region:</span>
        <strong class="text-foreground">${organization.region}</strong>
      </div>
      <div>
        <span class="text-muted-foreground">Cluster SLA:</span>
        <strong class="text-emerald-700">${organization.sla}</strong>
      </div>
    </div>
  </div>
</div>
