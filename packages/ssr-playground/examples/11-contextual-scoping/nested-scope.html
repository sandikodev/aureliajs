<div class="w-full max-w-sm mx-auto bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="px-5 py-3.5 border-b border-border/60 flex items-center justify-between gap-3 bg-surface/40">
    <div>
      <h3 class="text-xs font-semibold text-foreground tracking-tight m-0">Contextual Scoping</h3>
      <p class="text-[11px] text-muted-foreground mt-0.5 m-0">Nested scope evaluation via with.bind</p>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20 shrink-0">with.bind</span>
  </div>

  <div class="p-5 space-y-4">
    <div class="flex items-center gap-3.5">
      <div class="size-10 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-sm shrink-0 border border-primary/20">
        ${organization.name.charAt(0)}
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="text-xs font-semibold text-foreground truncate m-0">${organization.name}</h4>
        <p class="text-[11px] text-muted-foreground truncate m-0">Tier: ${organization.tier}</p>
      </div>
    </div>

    <div class="pt-3 border-t border-border/50 grid grid-cols-2 gap-2.5 text-xs">
      <div class="p-2.5 rounded bg-surface/60 border border-border/40">
        <span class="text-[10px] uppercase font-semibold text-muted-foreground block mb-0.5">Region</span>
        <strong class="text-foreground text-xs font-medium">${organization.region}</strong>
      </div>
      <div class="p-2.5 rounded bg-surface/60 border border-border/40">
        <span class="text-[10px] uppercase font-semibold text-muted-foreground block mb-0.5">Cluster SLA</span>
        <strong class="text-emerald-400 text-xs font-medium">${organization.sla}</strong>
      </div>
    </div>
  </div>
</div>
