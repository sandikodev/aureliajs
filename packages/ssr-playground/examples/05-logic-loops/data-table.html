<div class="w-full max-w-lg mx-auto bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="px-5 py-3.5 border-b border-border/60 flex items-center justify-between gap-3 bg-surface/40">
    <div>
      <h3 class="text-xs font-semibold text-foreground tracking-tight m-0">${title}</h3>
      <p class="text-[11px] text-muted-foreground mt-0.5 m-0">High-frequency telemetry stream</p>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20 shrink-0">repeat.for</span>
  </div>

  <div class="p-0">
    <table class="w-full text-left text-xs">
      <thead>
        <tr class="border-b border-border/50 text-muted-foreground text-[10px] uppercase font-semibold bg-surface/20">
          <th class="py-2.5 px-4 font-medium">Metric</th>
          <th class="py-2.5 px-4 font-medium">Value</th>
          <th class="py-2.5 px-4 font-medium text-right">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-border/40 font-mono">
        <tr repeat.for="row of rows" class="hover:bg-surface/30 transition">
          <td class="py-2.5 px-4 text-foreground text-xs font-sans">${row.name}</td>
          <td class="py-2.5 px-4 text-cyan-400 text-xs">${row.value}</td>
          <td class="py-2.5 px-4 text-right">
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span class="size-1 rounded-full bg-emerald-400"></span>
              ${row.status}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
