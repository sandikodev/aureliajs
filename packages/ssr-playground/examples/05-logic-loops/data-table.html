<div class="p-6 max-w-2xl mx-auto bg-card rounded-xl shadow-md border space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-foreground">${title}</h2>
    <span class="px-2 py-0.5 text-xs rounded-full bg-blue-100 text-blue-800 font-mono font-medium">repeat.for</span>
  </div>
  <table class="w-full text-left text-xs divide-y divide-border">
    <thead>
      <tr class="text-muted-foreground uppercase text-[10px]">
        <th class="py-2">Metric</th>
        <th>Value</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-border">
      <tr repeat.for="row of rows">
        <td class="py-2 font-mono">${row.name}</td>
        <td class="font-mono text-cyan-400">${row.value}</td>
        <td>
          <span class="px-2 py-0.5 rounded-full font-semibold text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            ${row.status}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
