<div class="au-card">
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">Content Projection</h3>
      <p class="au-card-subtitle">Transclusion with &lt;au-slot&gt;</p>
    </div>
    <span class="au-tag au-tag-cyan">&lt;au-slot&gt;</span>
  </div>

  <div class="au-card-body space-y-3.5">
    <!-- Header Target -->
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs font-semibold text-foreground">${dialogTitle}</span>
      <span class="au-tag au-tag-blue">${badge}</span>
    </div>

    <!-- Projected Body Content -->
    <p class="text-xs text-muted-foreground leading-relaxed m-0 au-box">
      ${dialogBody}
    </p>

    <!-- Footer Actions -->
    <div class="flex items-center justify-end gap-2 pt-1">
      <button type="button" class="au-btn-secondary">
        Dismiss
      </button>
      <button type="button" class="au-btn-primary">
        Confirm Action
      </button>
    </div>
  </div>
</div>
