<div class="w-full max-w-sm mx-auto bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="px-5 py-3.5 border-b border-border/60 flex items-center justify-between gap-3 bg-surface/40">
    <div>
      <h3 class="text-xs font-semibold text-foreground tracking-tight m-0">Content Projection</h3>
      <p class="text-[11px] text-muted-foreground mt-0.5 m-0">Transclusion with &lt;au-slot&gt;</p>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 shrink-0">&lt;au-slot&gt;</span>
  </div>

  <div class="p-5 space-y-3.5 text-xs">
    <!-- Header Target -->
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs font-semibold text-foreground">${dialogTitle}</span>
      <span class="px-1.5 py-0.5 rounded text-[10px] bg-primary/20 text-primary border border-primary/30 font-medium">${badge}</span>
    </div>

    <!-- Projected Body Content -->
    <p class="text-xs text-muted-foreground leading-relaxed m-0 p-3 bg-surface/50 rounded-lg border border-border/40">
      ${dialogBody}
    </p>

    <!-- Footer Actions -->
    <div class="flex items-center justify-end gap-2 pt-1">
      <button type="button" class="px-3 py-1.5 bg-surface border border-border/60 text-foreground rounded text-xs hover:bg-hover transition">
        Dismiss
      </button>
      <button type="button" class="px-3 py-1.5 bg-primary text-white rounded text-xs font-medium hover:bg-primary/90 transition shadow-sm">
        Confirm Action
      </button>
    </div>
  </div>
</div>
