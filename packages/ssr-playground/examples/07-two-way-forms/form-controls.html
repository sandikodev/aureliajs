<div class="w-full max-w-sm mx-auto bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="px-5 py-3.5 border-b border-border/60 flex items-center justify-between gap-3 bg-surface/40">
    <div>
      <h3 class="text-xs font-semibold text-foreground tracking-tight m-0">Form Controls</h3>
      <p class="text-[11px] text-muted-foreground mt-0.5 m-0">Bi-directional two-way synchronization</p>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shrink-0">value.bind</span>
  </div>

  <div class="p-5 space-y-4 text-xs">
    <!-- Form Inputs Group -->
    <div class="space-y-3">
      <div>
        <label class="block text-[11px] font-medium text-muted-foreground mb-1">Developer Handle</label>
        <input type="text" value.bind="username" class="w-full" />
      </div>

      <div>
        <label class="block text-[11px] font-medium text-muted-foreground mb-1">Architecture Preference</label>
        <select value.bind="framework">
          <option value="Aurelia 2 SSR">Aurelia 2 SSR (Hono Edge)</option>
          <option value="Aurelia .aux SFC">Aurelia in HTML (.aux)</option>
          <option value="Aurelia Resumable">Aurelia Resumable Zero-JS</option>
        </select>
      </div>

      <div class="flex items-center gap-2 pt-0.5">
        <input type="checkbox" id="sub-active" checked.bind="isActive" />
        <label for="sub-active" class="text-xs font-medium text-foreground cursor-pointer select-none">Enable Strict Security Sandbox</label>
      </div>
    </div>

    <!-- Synchronized State Box -->
    <div class="p-3 bg-surface/60 rounded-lg border border-border/60 font-mono text-[11px] space-y-1">
      <div class="text-[10px] uppercase font-semibold text-muted-foreground pb-1 border-b border-border/30">Synchronized State</div>
      <div class="flex items-center justify-between pt-1">
        <span class="text-muted-foreground">Username:</span>
        <strong class="text-primary font-medium">${username}</strong>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-muted-foreground">Target:</span>
        <strong class="text-emerald-400 font-medium">${framework}</strong>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-muted-foreground">Status:</span>
        <span class="inline-flex items-center gap-1 ${isActive ? 'text-emerald-400 font-semibold' : 'text-muted-foreground'}">
          <span class="size-1.5 rounded-full ${isActive ? 'bg-emerald-400' : 'bg-gray-500'}"></span>
          ${isActive ? 'ACTIVE' : 'DISABLED'}
        </span>
      </div>
    </div>
  </div>
</div>
