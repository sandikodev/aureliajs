<div class="au-card">
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">Value Converters</h3>
      <p class="au-card-subtitle">Pure idempotent formatting pipes</p>
    </div>
    <span class="au-tag au-tag-cyan">ValueConverter</span>
  </div>

  <div class="au-card-body space-y-3.5">
    <div class="divide-y divide-border/40 font-mono text-[11px]">
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Reference:</span>
        <span class="font-bold text-foreground">${orderCode}</span>
      </div>
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Plan Tier:</span>
        <span class="font-semibold text-primary uppercase font-sans">${tier}</span>
      </div>
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Commitment:</span>
        <span class="font-bold text-emerald-400 text-xs">${formattedSubtotal}</span>
      </div>
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Timestamp:</span>
        <span class="text-muted-foreground">${timestamp}</span>
      </div>
    </div>

    <div class="au-box text-[10px] text-muted-foreground leading-normal">
      Value Converters act as pure, idempotent pipes that decouple raw business data from localized display presentation.
    </div>
  </div>
</div>
