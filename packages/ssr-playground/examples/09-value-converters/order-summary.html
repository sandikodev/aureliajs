<div class="w-full max-w-sm mx-auto bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="px-5 py-3.5 border-b border-border/60 flex items-center justify-between gap-3 bg-surface/40">
    <div>
      <h3 class="text-xs font-semibold text-foreground tracking-tight m-0">Value Converters</h3>
      <p class="text-[11px] text-muted-foreground mt-0.5 m-0">Pure idempotent formatting pipes</p>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 shrink-0">ValueConverter</span>
  </div>

  <div class="p-5 space-y-3.5 text-xs">
    <div class="divide-y divide-border/40 font-mono text-[11px]">
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Reference:</span>
        <span class="font-bold text-foreground">${orderCode}</span>
      </div>
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Plan Tier:</span>
        <span class="font-semibold text-primary uppercase font-sans">${tier}</span>
      </div>
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Commitment:</span>
        <span class="font-bold text-emerald-400 text-xs">${formattedSubtotal}</span>
      </div>
      <div class="py-2 flex items-center justify-between">
        <span class="text-muted-foreground font-sans">Timestamp:</span>
        <span class="text-muted-foreground">${timestamp}</span>
      </div>
    </div>

    <div class="p-2.5 bg-surface/50 rounded border border-border/40 text-[10px] text-muted-foreground leading-normal">
      Value Converters act as pure, idempotent pipes that decouple raw business data from localized display presentation.
    </div>
  </div>
</div>
