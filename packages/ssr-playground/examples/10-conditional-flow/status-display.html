<div class="au-card">
  <!-- Card Header -->
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">Conditional Flow</h3>
      <p class="au-card-subtitle">Structural DOM control via if.bind</p>
    </div>
    <span class="au-tag au-tag-blue">if.bind</span>
  </div>

  <!-- Card Body -->
  <div class="au-card-body space-y-4">
    <!-- Status Row -->
    <div class="au-box space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-medium text-muted-foreground">Cluster Health</span>
        <span class="au-tag ${isOnline ? 'au-tag-emerald' : 'au-tag-rose'}">
          <span class="au-dot ${isOnline ? 'bg-emerald-400' : 'bg-rose-400'}"></span>
          ${isOnline ? 'Operational' : 'Degraded'}
        </span>
      </div>
      <p class="text-xs text-muted-foreground leading-relaxed m-0">${statusMessage}</p>
    </div>

    <!-- Action Row -->
    <div class="flex items-center justify-between gap-3 pt-1">
      <span class="text-[11px] text-muted-foreground">Simulate Service Fluctuation</span>
      <button type="button" class="au-btn-primary" click.trigger="toggle()">
        Toggle Server Health
      </button>
    </div>
  </div>
</div>
