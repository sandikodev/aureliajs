<div class="p-6 max-w-md mx-auto bg-card rounded-xl shadow-md border space-y-4">
  <div class="flex items-center justify-between border-b border-border pb-3">
    <div>
      <h2 class="text-xl font-bold text-foreground">Conditional Flow</h2>
      <p class="text-xs text-muted-foreground">Structural DOM control (if.bind / else / show.bind)</p>
    </div>
    <span class="px-2 py-0.5 text-xs rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-mono font-medium">if.bind</span>
  </div>

  <!-- Dynamic Status Box -->
  <div class="p-4 rounded-xl border border-border bg-secondary space-y-2">
    <div class="flex items-center justify-between">
      <span class="text-xs font-semibold text-muted-foreground">Cluster Health:</span>
      <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isOnline ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400'}">
        ${isOnline ? '● Operational' : '■ Degraded'}
      </span>
    </div>

    <div class="text-xs text-muted-foreground">
      ${statusMessage}
    </div>
  </div>

  <div class="flex items-center justify-between pt-2">
    <span class="text-xs text-muted-foreground">Simulate Service Fluctuation:</span>
    <button type="button" class="px-3 py-1.5 bg-primary text-white rounded-md text-xs font-medium hover:bg-primary/90" click.trigger="toggle()">
      Toggle Server Health
    </button>
  </div>
</div>
