<div class="au-card">
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">${title}</h3>
      <p class="au-card-subtitle">${description}</p>
    </div>
    <span class="au-tag au-tag-emerald">
      <span class="au-dot bg-emerald-400"></span>
      SSR Hydrated
    </span>
  </div>

  <div class="au-card-body">
    <div class="flex items-center justify-between gap-4">
      <button type="button" data-action="increment" data-testid="counter-btn" class="au-btn-primary" click.trigger="increment()">
        Count: ${count}
      </button>
      <div class="text-right">
        <span class="text-[11px] text-muted-foreground block">Computed Projection</span>
        <span data-testid="double-val" class="text-xs font-mono font-semibold text-primary">Double: ${count * 2}</span>
      </div>
    </div>
  </div>
</div>
