<div class="w-full max-w-sm mx-auto bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="px-5 py-3.5 border-b border-border/60 flex items-center justify-between gap-3 bg-surface/40">
    <div>
      <h3 class="text-xs font-semibold text-foreground tracking-tight m-0">${title}</h3>
      <p class="text-[11px] text-muted-foreground mt-0.5 m-0">${description}</p>
    </div>
    <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shrink-0">
      <span class="size-1.5 rounded-full bg-emerald-400"></span>
      SSR Hydrated
    </span>
  </div>

  <div class="p-5 flex items-center justify-between gap-4">
    <button type="button" data-action="increment" data-testid="counter-btn" class="px-3.5 py-1.5 bg-primary text-white rounded text-xs font-medium hover:bg-primary/90 transition shadow-sm" click.trigger="increment()">
      Count: ${count}
    </button>
    <div class="text-right">
      <span class="text-[11px] text-muted-foreground block">Computed Projection</span>
      <span data-testid="double-val" class="text-xs font-mono font-semibold text-primary">Double: ${count * 2}</span>
    </div>
  </div>
</div>
