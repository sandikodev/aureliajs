<div class="p-6 max-w-sm mx-auto bg-card rounded-xl shadow-md border space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-foreground">${title}</h2>
    <span class="px-2 py-0.5 text-xs rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">SSR Hydrated</span>
  </div>
  <p class="text-sm text-muted-foreground">${description}</p>
  <div class="flex items-center space-x-4">
    <button type="button" data-action="increment" data-testid="counter-btn" class="px-4 py-2 bg-primary text-white rounded-md text-sm font-medium hover:bg-primary/90" click.trigger="increment()">
      Count: ${count}
    </button>
    <span data-testid="double-val" class="text-xs text-muted-foreground">Double: ${count * 2}</span>
  </div>
</div>
