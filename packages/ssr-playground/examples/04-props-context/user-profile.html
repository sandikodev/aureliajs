<div class="p-6 max-w-md mx-auto bg-card rounded-xl shadow-md border space-y-4">
  <div class="flex items-center space-x-4">
    <div class="size-12 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-lg">
      ${user.name.charAt(0)}
    </div>
    <div>
      <h3 class="text-lg font-bold text-foreground">${user.name}</h3>
      <p class="text-xs text-muted-foreground">${user.email}</p>
    </div>
  </div>
  <div class="pt-2 border-t border-border grid grid-cols-2 gap-2 text-xs">
    <div><span class="text-muted-foreground">Workspace:</span> <strong class="text-foreground">${workspace.name}</strong></div>
    <div><span class="text-muted-foreground">Role:</span> <strong class="text-foreground">${role}</strong></div>
  </div>
</div>
