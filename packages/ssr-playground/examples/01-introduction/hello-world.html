<div class="au-card">
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">Aurelia 2 SSR</h3>
      <p class="au-card-subtitle">Zero client runtime overhead</p>
    </div>
    <span class="au-tag au-tag-emerald">
      <span class="au-dot bg-emerald-400"></span>
      SSR Hydrated
    </span>
  </div>

  <div class="au-card-body text-center space-y-3">
    <h1 class="text-xl font-bold tracking-tight text-foreground m-0">${greeting || 'Hello'}, ${name}!</h1>
    <p class="text-xs text-muted-foreground leading-relaxed m-0">${description}</p>
    <div class="pt-2">
      <span class="au-tag au-tag-emerald">
        <span class="au-dot bg-emerald-400"></span>
        Aurelia 2 Server-Side Rendered
      </span>
    </div>
  </div>
</div>
