<div class="au-card">
  <div class="au-card-header">
    <div>
      <h3 class="au-card-title">Dependency Injection</h3>
      <p class="au-card-subtitle">Aurelia 2 function-based resolve(ID)</p>
    </div>
    <span class="au-tag au-tag-purple">resolve(ID)</span>
  </div>

  <div class="au-card-body space-y-3.5">
    <div class="au-box space-y-1">
      <div class="text-[10px] uppercase font-semibold text-muted-foreground">Injected Service Token</div>
      <div class="font-mono text-foreground font-semibold text-xs">${serviceName}</div>
      <p class="text-[11px] text-muted-foreground m-0 pt-0.5 leading-normal">Resolved without constructor parameter injection boilerplate.</p>
    </div>

    <div class="grid grid-cols-2 gap-2.5 text-xs">
      <div class="au-box">
        <span class="text-muted-foreground block text-[10px] uppercase font-semibold mb-0.5">DI Scope</span>
        <strong class="text-primary font-mono text-xs font-medium">${diScope}</strong>
      </div>
      <div class="au-box">
        <span class="text-muted-foreground block text-[10px] uppercase font-semibold mb-0.5">Instances</span>
        <strong class="text-emerald-400 font-mono text-xs font-medium">${instanceCount} Singleton</strong>
      </div>
    </div>
  </div>
</div>
