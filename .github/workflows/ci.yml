name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://aureliajs:aureliajs@localhost:5432/aureliajs
  SESSION_SECRET: ci-only-secret-not-used-in-production
  WEB_ORIGIN: http://localhost:4600
  # A dummy key is enough for the webhook suite: Stripe's signature
  # verification is pure crypto and never calls the Stripe API. The price ids
  # stay unset on purpose so the "checkout is refused" path is the one that
  # runs in CI.
  STRIPE_SECRET_KEY: sk_test_ci_dummy_key_for_signature_verification_only
  STRIPE_WEBHOOK_SECRET: ci_webhook_secret_for_tests

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aureliajs
          POSTGRES_PASSWORD: aureliajs
          POSTGRES_DB: aureliajs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aureliajs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aureliajs/shared build

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
