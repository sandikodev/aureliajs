<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurelia Ops — SaaS admin dashboard</title>
    <meta
      name="description"
      content="A production-shaped SaaS admin dashboard built with Aurelia 2, TypeScript, Tailwind CSS and Hono."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://aureliajs.vercel.app/" />
    <!-- Social previews: crawlers do not execute the SPA, so these live in the
         shell HTML rather than being set from JavaScript. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurelia Ops" />
    <meta property="og:url" content="https://aureliajs.vercel.app/" />
    <meta property="og:title" content="Aurelia Ops — SaaS Admin Dashboard" />
    <meta
      property="og:description"
      content="A production-shaped SaaS admin dashboard built with Aurelia 2, TypeScript, Tailwind CSS and Hono."
    />
    <meta property="og:image" content="https://aureliajs.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aurelia Ops — SaaS Admin Dashboard" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://aureliajs.vercel.app/og-image.png" />
    <meta name="twitter:title" content="Aurelia Ops — SaaS Admin Dashboard" />
    <meta
      name="twitter:description"
      content="Session auth, team invitations, Stripe billing and a real Hono API. Built with Aurelia 2."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Aurelia Ops",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Production-shaped SaaS admin dashboard with session auth, team invitations, Stripe billing and a Hono API.",
        "url": "https://aureliajs.vercel.app/",
        "codeRepository": "https://github.com/sandikodev/aureliajs"
      }
    </script>
    <!-- The router resolves routes relative to <base>; without it, deep links
         (e.g. /projects) are treated as the root path on a hard reload. -->
    <base href="/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="ard" type="application/json" href="/.well-known/ard.json" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('aurelia-ops-theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
    <style>
      /* Critical pre-paint styles to eliminate FOUC before CSS bundle loads */
      html,
      body {
        height: 100%;
        background-color: #ffffff;
        color: #09090b;
      }
      html.dark,
      html.dark body {
        background-color: #09090b;
        color: #fafafa;
      }
      app-root {
        display: block;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body class="h-full">
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
