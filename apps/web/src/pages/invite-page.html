<div class="mx-auto max-w-md py-10">
  <ui-card>
    <ui-card-header>
      <ui-card-title>Workspace invitation</ui-card-title>
      <ui-card-description>One link, one seat — no password needed</ui-card-description>
    </ui-card-header>
    <ui-card-content>
      <div if.bind="state === 'working'" class="space-y-3" data-testid="invite-working">
        <ui-skeleton width="100%" height="1rem" rounded="rounded-md"></ui-skeleton>
        <ui-skeleton width="70%" height="1rem" rounded="rounded-md"></ui-skeleton>
        <p class="text-[13px] text-muted-foreground">Checking your invitation…</p>
      </div>

      <div if.bind="state === 'accepted'" class="space-y-4" data-testid="invite-accepted">
        <ui-alert tone="success">
          <ui-icon name="check" size="16"></ui-icon>
          <span class="flex-1">
            You are now a member of ${workspaceName}. The workspace is already open in this browser.
          </span>
        </ui-alert>
        <ui-button full click.trigger="goToWorkspace()">
          <ui-icon name="layoutDashboard" size="15"></ui-icon>
          Go to the dashboard
        </ui-button>
      </div>

      <div if.bind="state === 'failed'" class="space-y-4" data-testid="invite-failed">
        <ui-alert tone="destructive">
          <ui-icon name="alert" size="16"></ui-icon>
          <span class="flex-1">${error}</span>
        </ui-alert>
        <p class="text-[12px] text-muted-foreground">Ask the workspace owner to send a fresh invitation.</p>
        <ui-button variant="outline" full click.trigger="goToWorkspace()">Go to the dashboard</ui-button>
      </div>
    </ui-card-content>
  </ui-card>
</div>
