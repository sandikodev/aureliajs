<!-- Native HTML Hypermedia Fragment enhanced via Aurelia's `au-htmx` Custom Attribute -->
<section class="htmx-box" au-htmx>
  <button
    type="button"
    class="btn btn-secondary"
    id="htmx-trigger-btn"
    data-testid="htmx-btn"
    hx-get="/api/htmx/pulse"
    hx-target="#htmx-pulse-out"
    hx-swap="innerHTML"
  >
    ⚡ Trigger HTMX Server Swap
  </button>
  <div id="htmx-pulse-out" class="htmx-output" data-testid="htmx-output">
    <em>Ready. Click button to trigger server swap.</em>
  </div>
</section>
