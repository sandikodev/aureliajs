<div class="counter-box">
  <div class="counter-display">
    <span class="counter-label">Current Count:</span>
    <span class="counter-val">${count}</span>
  </div>
  <div class="counter-actions">
    <button type="button" class="btn btn-sm" click.trigger="decrement()">- ${step}</button>
    <button type="button" class="btn btn-sm btn-primary" click.trigger="increment()">+ ${step}</button>
  </div>
</div>
