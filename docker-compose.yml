services:
  db:
    image: postgres:16-alpine
    container_name: aureliajs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aureliajs
      POSTGRES_PASSWORD: aureliajs
      POSTGRES_DB: aureliajs
    ports:
      - '127.0.0.1:5544:5432'
    volumes:
      - aureliajs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aureliajs -d aureliajs']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aureliajs-pgdata:
